rules:
  # Bronze
  action-setup:
    status: exempt
    comment: |
      No custom actions are defined.
  appropriate-polling:
    status: done
    comment: |
      Push updates over MQTT; settings that the gateway does not push are
      polled once a minute.
  brands:
    status: done
    comment: |
      Brand images are shipped in the brand folder of the integration.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: |
      No custom actions are defined.
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup:
    status: done
    comment: |
      Push updates are subscribed by the coordinator, entities only listen to
      the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery:
    status: done
    comment: |
      DHCP discovery based on the Carel pCOWeb hostname and OUI.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      A gateway is connected to exactly one heat pump manager.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: |
      No repairable situations exist; connection and credential problems are
      handled by the reauthentication flow and entity availability.
  stale-devices:
    status: exempt
    comment: |
      A gateway is connected to exactly one heat pump manager.

  # Platinum
  async-dependency:
    status: done
    comment: |
      The pydimplex-nwpm library uses aiomqtt and the asynchronous pymodbus
      client.
  inject-websession:
    status: exempt
    comment: |
      The integration does not use HTTP.
  strict-typing: done
