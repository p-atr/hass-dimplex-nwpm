[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Mirrors the checks Home Assistant core applies to strictly typed integrations.
[tool.mypy]
python_version = "3.14"
files = ["custom_components/dimplex_nwpm"]
strict_equality = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = ["deprecated", "explicit-override", "ignore-without-code", "redundant-self", "truthy-iterable"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true
